[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantagent"
version = "0.1.0"
description = "Agentic quantitative research and ML evaluation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "fastapi>=0.110",
  "uvicorn[standard]>=0.27", "pydantic>=2.6", "yfinance>=0.2.36", "streamlit>=1.32"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3", "httpx>=0.27"]
mcp = ["mcp>=1.0"]
tracking = ["mlflow>=2.11"]
boosting = ["xgboost>=2.0"]

[project.scripts]
quantagent-api = "quantagent.api:run"
quantagent-dashboard = "quantagent.dashboard:run"

[tool.setuptools.packages.find]
include = ["quantagent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
