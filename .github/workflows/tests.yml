name: tests
on:
  push:
    branches: [main, "improve/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check quantagent tests scripts
      - name: Test
        run: pytest -q
      - name: Workflow reliability benchmark
        run: python scripts/benchmark_workflow.py
